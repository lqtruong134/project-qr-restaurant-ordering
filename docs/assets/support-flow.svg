<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><rect width="1000" height="660" fill="#f1f5f3"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#315b49"/></marker></defs><g font-family="Segoe UI,Arial" fill="#243d31"><text x="40" y="42" font-size="25" font-weight="700">Ai đang chịu trách nhiệm hỗ trợ khách?</text><rect x="40" y="76" width="625" height="80" rx="12" fill="white" stroke="#96b5a3"/><text x="62" y="107" font-size="21" font-weight="600">1. Khách gửi yêu cầu</text><text x="62" y="134" font-size="17">NEW · Chưa có người nhận</text><path d="M352 157V180" fill="none" stroke="#315b49" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="184" width="625" height="80" rx="12" fill="white" stroke="#96b5a3"/><text x="62" y="215" font-size="21" font-weight="600">2. Hùng nhận xử lý</text><text x="62" y="242" font-size="17">ACKNOWLEDGED · Hùng phụ trách</text><path d="M352 265V288" fill="none" stroke="#315b49" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="292" width="625" height="80" rx="12" fill="white" stroke="#96b5a3"/><text x="62" y="323" font-size="21" font-weight="600">3. Hùng gửi bàn giao cho Lan</text><text x="62" y="350" font-size="17">PENDING · Hùng vẫn phụ trách</text><path d="M352 373V396" fill="none" stroke="#315b49" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="400" width="625" height="80" rx="12" fill="white" stroke="#96b5a3"/><text x="62" y="431" font-size="21" font-weight="600">4. Lan đồng ý nhận bàn giao</text><text x="62" y="458" font-size="17">ACCEPTED · Lan trở thành người phụ trách</text><path d="M352 481V504" fill="none" stroke="#315b49" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="508" width="625" height="80" rx="12" fill="white" stroke="#96b5a3"/><text x="62" y="539" font-size="21" font-weight="600">5. Lan hỗ trợ xong và xác nhận</text><text x="62" y="566" font-size="17">RESOLVED · Lưu người/thời điểm hoàn tất</text><rect x="692" y="292" width="270" height="169" rx="12" fill="#fff9ed" stroke="#b79451"/><text x="712" y="325" font-size="18" font-weight="600">Lan từ chối / chưa trả lời</text><text x="712" y="358" font-size="17">→ Hùng vẫn phụ trách.</text><text x="712" y="397" font-size="17">Hùng xử lý xong lúc chờ:</text><text x="712" y="428" font-size="17">→ đóng bàn giao + hoàn tất.</text><text x="42" y="643" font-size="16">Khách chỉ thấy: Đã gửi → Nhân viên đang xử lý → Đã xử lý.</text></g></svg>