<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-label="Dòng món: quy trình bình thường"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#c56b38"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f1f6f3"/><text x="50" y="48" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#163b34">Dòng món: quy trình bình thường</text><text x="50" y="79" font-family="Segoe UI,Arial" font-size="16" fill="#56746b"></text><rect x="45" y="105" width="910" height="74" rx="10" fill="white" stroke="#c4d7cf"/><circle cx="80" cy="142" r="18" fill="#175f4c"/><text x="80" y="148" font-family="Arial" text-anchor="middle" font-size="17" fill="white">1</text><text x="115" y="134" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#163b34">SUBMITTED → ACCEPTED</text><text x="115" y="160" font-family="Segoe UI,Arial" font-size="16" fill="#536b63">Bếp tiếp nhận; các lượt PENDING_REVIEW phải được duyệt trước.</text><path d="M500 181V197" stroke="#c56b38" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="205" width="910" height="74" rx="10" fill="white" stroke="#c4d7cf"/><circle cx="80" cy="242" r="18" fill="#175f4c"/><text x="80" y="248" font-family="Arial" text-anchor="middle" font-size="17" fill="white">2</text><text x="115" y="234" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#163b34">ACCEPTED → IN_PREPARATION</text><text x="115" y="260" font-family="Segoe UI,Arial" font-size="16" fill="#536b63">Bếp bắt đầu; kho tiêu hao ở bước này.</text><path d="M500 281V297" stroke="#c56b38" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="305" width="910" height="74" rx="10" fill="white" stroke="#c4d7cf"/><circle cx="80" cy="342" r="18" fill="#175f4c"/><text x="80" y="348" font-family="Arial" text-anchor="middle" font-size="17" fill="white">3</text><text x="115" y="334" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#163b34">IN_PREPARATION → READY</text><text x="115" y="360" font-family="Segoe UI,Arial" font-size="16" fill="#536b63">Bếp báo món sẵn sàng.</text><path d="M500 381V397" stroke="#c56b38" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="405" width="910" height="74" rx="10" fill="white" stroke="#c4d7cf"/><circle cx="80" cy="442" r="18" fill="#175f4c"/><text x="80" y="448" font-family="Arial" text-anchor="middle" font-size="17" fill="white">4</text><text x="115" y="434" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#163b34">READY → SERVED</text><text x="115" y="460" font-family="Segoe UI,Arial" font-size="16" fill="#536b63">Phục vụ xác nhận đã mang ra.</text><path d="M500 481V497" stroke="#c56b38" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="505" width="910" height="74" rx="10" fill="white" stroke="#c4d7cf"/><circle cx="80" cy="542" r="18" fill="#175f4c"/><text x="80" y="548" font-family="Arial" text-anchor="middle" font-size="17" fill="white">5</text><text x="115" y="534" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#163b34">Ngoại lệ được xử lý riêng</text><text x="115" y="560" font-family="Segoe UI,Arial" font-size="16" fill="#536b63">Hủy sớm / hết món / lỗi nhà hàng được ADMIN xác nhận / đổi ý; đọc bài 05.</text></svg>