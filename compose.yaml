name: qr-ordering-thesis
services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres_data:
